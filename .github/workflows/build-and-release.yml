name: Build and Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --build-cache

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: Run unit tests
        run: ./gradlew test

      - name: Run instrumented tests
        run: ./gradlew connectedAndroidTest || true

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bookora-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bookora-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: bookora-release-apk

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: bookora-release-aab

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          release_name: Bookora ${{ steps.version.outputs.VERSION }}
          body: |
            ## Bookora Release ${{ steps.version.outputs.VERSION }}
            
            ### What's New
            - Build: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            
            ### Downloads
            - APK: `app-release.apk`
            - AAB: `app-release.aab` (for Google Play)
            
            ### Installation
            1. Download the APK file
            2. Transfer to your Android device
            3. Enable "Unknown Sources" in Settings
            4. Install the APK
            
            Or upload the AAB to Google Play Console.
          draft: false
          prerelease: false

      - name: Upload APK Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./app-release.apk
          asset_name: bookora-${{ steps.version.outputs.VERSION }}.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload AAB Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./app-release.aab
          asset_name: bookora-${{ steps.version.outputs.VERSION }}.aab
          asset_content_type: application/octet-stream

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lint || true

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html

  notify:
    needs: [build, lint]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Build Status Notification
        run: |
          if [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.lint.result }}" = "success" ]; then
            echo "✅ Build and Lint SUCCESSFUL"
          else
            echo "❌ Build or Lint FAILED"
          fi
