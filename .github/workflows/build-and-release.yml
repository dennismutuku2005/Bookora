name: Build and Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --build-cache

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: List build outputs
        if: always()
        run: |
          echo "=== APK Outputs ==="
          find app/build/outputs/apk -type f -name "*.apk" 2>/dev/null || echo "No APKs found"
          echo "=== AAB Outputs ==="
          find app/build/outputs/bundle -type f -name "*.aab" 2>/dev/null || echo "No AABs found"

      - name: Run unit tests
        run: ./gradlew test

      - name: Run instrumented tests
        run: ./gradlew connectedAndroidTest || true

      - name: Upload APK to artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bookora-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB to artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bookora-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bookora-release-apk

      - name: Download AAB
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: bookora-release-aab

      - name: List downloaded files
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files ==="
          ls -la

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Upload APK Release Asset
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.apk
          tag_name: ${{ steps.version.outputs.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AAB Release Asset
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.aab
          tag_name: ${{ steps.version.outputs.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lint || true

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html

  notify:
    needs: [build, lint]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Build Status Notification
        run: |
          if [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.lint.result }}" = "success" ]; then
            echo "✅ Build and Lint SUCCESSFUL"
          else
            echo "❌ Build or Lint FAILED"
          fi
